<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="signal-slip" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feOffset in="SourceGraphic" dx="0.06" dy="0" result="shift-right"/>
    <feOffset in="SourceGraphic" dx="-0.05" dy="0" result="shift-left"/>
    <feFlood x="0" y="0.29" width="1" height="0.065" result="upper-band"/>
    <feComposite in="shift-right" in2="upper-band" operator="in" result="upper-slip"/>
    <feFlood x="0" y="0.52" width="1" height="0.035" result="middle-band"/>
    <feComposite in="shift-left" in2="middle-band" operator="in" result="middle-slip"/>
    <feFlood x="0" y="0.72" width="1" height="0.07" result="lower-band"/>
    <feComposite in="shift-right" in2="lower-band" operator="in" result="lower-slip"/>
    <feMerge>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="upper-slip"/>
      <feMergeNode in="middle-slip"/>
      <feMergeNode in="lower-slip"/>
    </feMerge>
  </filter>
</svg>
